<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Preparing Your Offer...</title>

<meta http-equiv="X-UA-Compatible" content="IE=edge">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#ffffff;

    font-family:Arial, Helvetica, sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    text-align:center;

    overflow:hidden;

}

.container{

    width:90%;

    max-width:500px;

    animation:fadeIn 0.5s ease-out;

}

/* LOGO */

.logo{

    width:240px;

    max-width:85%;

    height:auto;

    margin-bottom:30px;

    animation:logoAppear 0.6s ease-out;

}

/* TITLE */

h1{

    font-size:32px;

    color:#202b38;

    margin-bottom:14px;

    font-weight:700;

}

/* DESCRIPTION */

p{

    font-size:17px;

    line-height:1.5;

    color:#667085;

    margin-bottom:30px;

}

/* LOADING CIRCLE */

.loader{

    width:62px;

    height:62px;

    border:6px solid #e8edf2;

    border-top:6px solid #1976d2;

    border-radius:50%;

    animation:spin 0.8s linear infinite;

    margin:auto;

}

/* FOOTER */

.footer{

    position:fixed;

    bottom:22px;

    left:0;

    right:0;

    padding:0 20px;

    font-size:13px;

    color:#98a2b3;

}

/* ANIMATIONS */

@keyframes spin{

    0%{

        transform:rotate(0deg);

    }

    100%{

        transform:rotate(360deg);

    }

}

@keyframes fadeIn{

    from{

        opacity:0;

        transform:translateY(12px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

@keyframes logoAppear{

    from{

        opacity:0;

        transform:scale(0.92);

    }

    to{

        opacity:1;

        transform:scale(1);

    }

}

/* MOBILE */

@media(max-width:480px){

    .logo{

        width:210px;

        margin-bottom:25px;

    }

    h1{

        font-size:27px;

    }

    p{

        font-size:16px;

    }

}

</style>

</head>

<body>

<div class="container">

<img 
src="https://d3q7porexqyyxj.cloudfront.net/sites/5009/aws-logo.png"
alt="Americas Window Solutions"
class="logo"
>

<h1>Preparing Your Offer...</h1>

<p>
Please wait while we securely prepare your personalized offer.
</p>

<div class="loader"></div>

</div>

<div class="footer">

Please do not close this page. You’ll be redirected automatically.

</div>

<script>

setTimeout(function(){

window.location.replace(
"https://r9ebmun.com/?E=2Z%2ffFsY0y73kpfwizdG5uy9GOm3iJU0T&s1="
);

},400);

</script>

</body>

</html>
