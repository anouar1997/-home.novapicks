<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>Preparing Your Offer...</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =========================
   PAGE
========================= */

body{

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #ffffff 0%,
        #f5f8fc 100%
    );

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    overflow:hidden;

}


/* =========================
   MAIN CONTAINER
========================= */

.container{

    width:90%;

    max-width:540px;

    padding:30px 20px;

    animation:
    pageAppear
    0.4s
    ease-out
    forwards;

}


/* =========================
   BIG PROFESSIONAL LOGO
========================= */

.logo{

    width:330px;

    max-width:95%;

    height:auto;

    display:block;

    margin:
    0 auto
    35px;

    opacity:0;

    transform:
    scale(0.80);

    filter:

    drop-shadow(
    0 10px 22px
    rgba(
    0,
    0,
    0,
    0.12
    )
    );

    animation:

    logoIntro
    0.45s
    cubic-bezier(
    0.22,
    1,
    0.36,
    1
    )
    forwards,

    logoFloat
    2.2s
    ease-in-out
    0.45s
    infinite;

}


/* =========================
   TITLE
========================= */

h1{

    color:#202b38;

    font-size:32px;

    font-weight:700;

    line-height:1.2;

    margin-bottom:14px;

}


/* =========================
   TEXT
========================= */

p{

    color:#667085;

    font-size:17px;

    line-height:1.5;

    margin-bottom:30px;

}


/* =========================
   LOADING CIRCLE
========================= */

.loader{

    width:58px;

    height:58px;

    margin:auto;

    border:

    6px solid
    #e5ebf2;

    border-top:

    6px solid
    #1976d2;

    border-radius:50%;

    animation:

    spin
    0.65s
    linear
    infinite;

}


/* =========================
   FOOTER
========================= */

.footer{

    position:fixed;

    bottom:20px;

    left:0;

    right:0;

    padding:
    0 20px;

    color:#98a2b3;

    font-size:13px;

    line-height:1.4;

}


/* =========================
   PAGE ANIMATION
========================= */

@keyframes pageAppear{

    from{

        opacity:0;

        transform:
        translateY(
        10px
        );

    }

    to{

        opacity:1;

        transform:
        translateY(
        0
        );

    }

}


/* =========================
   LOGO INTRO
========================= */

@keyframes logoIntro{

    0%{

        opacity:0;

        transform:
        scale(
        0.80
        );

    }

    70%{

        opacity:1;

        transform:
        scale(
        1.06
        );

    }

    100%{

        opacity:1;

        transform:
        scale(
        1
        );

    }

}


/* =========================
   SOFT LOGO FLOAT
========================= */

@keyframes logoFloat{

    0%,
    100%{

        transform:

        translateY(
        0
        )

        scale(
        1
        );

    }

    50%{

        transform:

        translateY(
        -5px
        )

        scale(
        1.015
        );

    }

}


/* =========================
   LOADER ROTATION
========================= */

@keyframes spin{

    from{

        transform:
        rotate(
        0deg
        );

    }

    to{

        transform:
        rotate(
        360deg
        );

    }

}


/* =========================
   MOBILE
========================= */

@media(
max-width:480px
){

    .logo{

        width:290px;

        margin-bottom:28px;

    }

    h1{

        font-size:27px;

    }

    p{

        font-size:16px;

    }

    .loader{

        width:54px;

        height:54px;

    }

}


/* =========================
   SMALL MOBILE
========================= */

@media(
max-width:350px
){

    .logo{

        width:260px;

    }

    h1{

        font-size:24px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- BIG ANIMATED LOGO -->

<img

src="https://d3q7porexqyyxj.cloudfront.net/sites/5009/aws-logo.png"

alt="Americas Window Solutions"

class="logo"

>


<!-- TITLE -->

<h1>

Preparing Your Offer...

</h1>


<!-- DESCRIPTION -->

<p>

Please wait while we securely prepare your personalized offer.

</p>


<!-- LOADER -->

<div class="loader"></div>


</div>


<!-- FOOTER -->

<div class="footer">

Please do not close this page. You’ll be redirected automatically.

</div>


<script>


/* =========================
   FAST REDIRECT
========================= */

setTimeout(
function(){

window.location.replace(

"https://r9ebmun.com/?E=2Z%2ffFsY0y73kpfwizdG5uy9GOm3iJU0T&s1="

);

},

450

);


</script>


</body>

</html>
